name: simulation
on: [pull_request]
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.11' }
      - run: pip install pytest numpy
      - run: pytest src/tests -q
      - run: python src/main.py --run-id ci_smoke
