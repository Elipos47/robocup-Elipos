[camera]
; --- RISOLUZIONE E FRAMERATE ---
; Risoluzione ridotta per processing più veloce (57% pixel in meno vs 640x480)
; Overengineered usa 448x252, che è un buon compromesso tra dettaglio e velocità
width = 448
height = 252
; FPS target: la IMX708 supporta fino a 120 FPS a basse risoluzioni
; 60 FPS = reazione 2x più veloce alle curve rispetto a 30 FPS
fps = 60
; --- FOCUS MANUALE ---
; La IMX708 (Camera Module 3) ha autofocus, ma per line-following la distanza è fissa.
; Disabilitando l'AF ed usando focus manuale si elimina latenza e blur durante la messa a fuoco.
; LensPosition 6.5 ≈ 15cm (macro) - ideale per guardare la linea davanti al robot
; ALZA se la linea è sfocata (camera più lontana dalla linea), ABBASSA se troppo vicina
lens_position = 6.5

[color_values]
; Soglie HSV per il rilevamento del verde (marker svolta)
green_hsv_low = [40, 50, 45]
green_hsv_high = [85, 255, 255]
; Soglie HSV per il rilevamento del rosso (marker stop) - due range perché il rosso è ai bordi dello spettro H
red_hsv_low_1 = [0, 100, 90]
red_hsv_high_1 = [10, 255, 255]
red_hsv_low_2 = [170, 100, 100]
red_hsv_high_2 = [180, 255, 255]

[line_params]
; Regione di interesse (ROI) per il rilevamento linea, in percentuale dell'altezza frame
; NOTA: ora usa ROI fisso in line_detector.py (20%-85%), questi valori sono di riferimento
roi_height_start = 0.20
roi_height_end = 0.85
; Quanto della parte SUPERIORE del contorno viene scartata per il calcolo angolo.
; PRIMA era 0.48 (scartava il 48% superiore → distruggeva l'informazione della curva!)
; ORA ridotto a 0.20 per preservare la curvatura della linea.
; ALZA se l'angolo oscilla troppo, ABBASSA se non vede le curve
line_crop_factor = 0.20
; Larghezza minima in pixel per considerare un blob come linea
min_line_width = 20
; Rapporto massimo larghezza linea / larghezza frame (oltre = non è una linea)
max_line_width_ratio = 0.25

[morphology]
; Dimensione kernel per operazioni morfologiche (erode/dilate)
kernel_size = 3
; Operazioni morfologiche per rilevamento linea: erode1 -> dilate -> erode2
; La linea curva a 448x252 può essere sottile (12-14px). Con erode=5 e kernel 3x3,
; si perdono ~5px per lato = la curva sparisce. Ridotto erode1 a 3 e dilate a 13
; per preservare le curve sottili. Il rapporto erode1+erode2 vs dilate determina 
; la tolleranza: (3+7)=10 vs 13 = net +3 (espansione).
; ALZA erode se rileva ombre come linea, ABBASSA se perde la linea in curva
erode_iterations_line = 3
dilate_iterations_line = 13
erode_iterations_line_2 = 7
; Operazioni morfologiche durante GAP_AVOID: solo erode1 -> dilate (2 step)
; erode2=0 significa niente secondo erode (mantiene linea più spessa per riacquisto dopo gap)
erode_iterations_gap = 3
dilate_iterations_gap = 8
erode_iterations_gap_2 = 0

[detection]
; --- SOGLIE NERO ---
; Valore massimo RGB per considerare un pixel come "nero" (la linea)
; La parte alta del frame usa soglie più strette (meno artefatti)
; ALZA se il robot perde la linea, ABBASSA se rileva troppo
black_threshold_top = 65
black_threshold_bottom = 95

; --- FILTRO OMBRE ---
; Pixel con Value (luminosità HSV) sopra questa soglia vengono scartati
; Le ombre hanno V alto (100-160), il nero vero ha V basso (<100)
; PRIMA era 60 — troppo aggressivo! Con black_threshold_bottom=95 il filtro
; cancellava pixel con V 60-95 che sono legittimamente neri. Causava asimmetria
; sinistra-destra: la parte destra del frame è leggermente più luminosa (V~65-80)
; e la linea veniva "mangiata" solo a destra. Alzato a 100 per non interferire
; con i pixel neri legittimi (V<95) rilevati dalla soglia nero.
; ALZA se perde la linea in zone scure, ABBASSA se rileva ombre come linea
shadow_v_min = 100

; --- RILEVAMENTO COLORI ---
; Area minima in pixel per considerare un blob come marker verde
; NOTA: Scalato per risoluzione 448x252 (era 2500 a 640x480, rapporto area ~0.49)
green_min_area = 1225
; Area minima in pixel per considerare un blob come marker rosso
; NOTA: Scalato per risoluzione 448x252 (era 1500 a 640x480)
red_min_area = 735
; Tolleranza aspect ratio per validazione marker
aspect_ratio_tol = 0.3

; --- RILEVAMENTO LINEA ---
; Frame senza linea prima di dichiararla persa e fermarsi
; NOTA: Scalato per 60 FPS (era 5 a 30 FPS = ~167ms, ora 10 a 60 FPS = ~167ms)
line_loss_threshold = 10
; Frame necessari per validare la presenza di un gap
; NOTA: Scalato per 60 FPS (era 3 a 30 FPS = ~100ms, ora 6 a 60 FPS = ~100ms)
gap_validation_frames = 6
; Area minima gap in pixel
; NOTA: Scalato per risoluzione 448x252 (era 1000 a 640x480)
gap_min_area = 490
; Distanza in cm per rilevare un ostacolo
obstacle_distance_cm = 15

[control]
; --- CENTRATURA RETTILINEO ---
; Percentuale di tolleranza dal centro prima di correggere (0.15 = 15%)
deadband_center = 0.15
; Isteresi per evitare oscillazione nella centratura (0.20 = 20%)
hysteresis_margin = 0.25
; Angolo in gradi sopra il quale il robot entra in "curve mode"
angle_threshold = 25
; Deadband angolari per evitare micro-correzioni
angle_deadband = 8
; Frame di lock dopo rilevamento marker verde
; NOTA: Scalato per 60 FPS (era 45 a 30 FPS = ~1.5s, ora 90 a 60 FPS = ~1.5s)
green_lock_duration = 90
; Secondi di timeout safety se il robot è fermo
stop_timeout = 5.0

; --- CURVE ---
; Frame "avanti" prima di iniziare a curvare (compensa camera montata davanti)
; ALZA se le curve sono troppo strette, ABBASSA se perde la linea in curva
; NOTA: Scalato per 60 FPS (era 2 a 30 FPS = ~67ms, ora 4 a 60 FPS = ~67ms)
curve_entry_delay = 5
; Angolo in gradi sotto il quale si esce dal "curve mode"
curve_exit_threshold = 15
; Frame consecutivi con angolo basso necessari per uscire dalla curva
; Evita che il robot pensi di essere in rettilineo durante la curva
; NOTA: Scalato per 60 FPS (era 3 a 30 FPS = ~100ms, ora 6 a 60 FPS = ~100ms)
curve_exit_frames = 30
; 1 frame "avanti" ogni N frame di curva (fa avanzare il robot mentre gira)
; ALZA se le curve sono troppo corte, ABBASSA se il robot non avanza abbastanza in curva
; NOTA: Questo è un ratio, non un tempo - resta uguale indipendentemente dagli FPS
curve_forward_ratio = 3

; --- SEESAW/RAMPA ---
; Pitch del giroscopio (gradi) sotto il quale il robot è inclinato (rampa/seesaw)
seesaw_pitch_threshold = -8
; Frame consecutivi con pitch inclinato per confermare seesaw
; NOTA: Scalato per 60 FPS (era 5 a 30 FPS = ~167ms, ora 10 a 60 FPS = ~167ms)
seesaw_min_frames = 10

